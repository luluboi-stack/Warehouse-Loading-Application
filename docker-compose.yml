services:
  postgres:
    image: postgres:16-alpine
    container_name: ather_dock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ather_admin
      POSTGRES_PASSWORD: ather_local_password
      POSTGRES_DB: ather_dock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
